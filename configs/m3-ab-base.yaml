# M3 layer A/B base: ~20M, M1-style layers; variants change one field each via --set.
# Data, tokenizer and shards are shared by all M3 configs (keep them identical).
data:
  name: m3-mix
  version: 1
  min_chars: 200
  max_chars: 100000
  quality_filters: true
  near_dedup: true
  workers: 8
  decontaminate:
  - hellaswag
  - arc_easy
  - arc_challenge
  - piqa
  - gsm8k
  split:
    train: 0.995
    val: 0.004
    test: 0.001
  sources:
  - name: fineweb-edu
    type: hf
    path: HuggingFaceFW/fineweb-edu
    config_name: sample-10BT
    streaming: true
    max_bytes: 20000000000
    min_score_field: int_score
    min_score: 3
    license: ODC-By-1.0
    url: https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu
    note: Educational web pages filtered by an LLM-based classifier (Penedo et al., 2024).
  - name: wikipedia
    type: hf
    path: wikimedia/wikipedia
    config_name: 20231101.en
    streaming: true
    max_bytes: 4000000000
    chunk_chars: 20000
    license: CC-BY-SA-3.0 / GFDL
    url: https://huggingface.co/datasets/wikimedia/wikipedia
  - name: finemath
    type: hf
    path: HuggingFaceTB/finemath
    config_name: finemath-4plus
    streaming: true
    max_bytes: 2000000000
    license: ODC-By-1.0
    url: https://huggingface.co/datasets/HuggingFaceTB/finemath
  - name: gutenberg
    type: hf
    path: sedthh/gutenberg_english
    text_field: TEXT
    streaming: true
    max_bytes: 2000000000
    chunk_chars: 8000
    license: public domain (Project Gutenberg, US)
    url: https://huggingface.co/datasets/sedthh/gutenberg_english
tokenizer:
  name: m3-bpe
  version: 1
  vocab_size: 32768
  train_sample_bytes: 200000000
  sample: spread
  special_tokens:
  - <think>
  - </think>
  - <speak>
  - <revise>
  - <search>
  - <calc>
  - <code>
  - <docs>
  - <result>
  - </result>
  - <ask_thinker>
  - <action>
  - <remember>
  - <recall>
  - <now>
  - <user>
  - <pluto>
  - <sure>
  - <unsure>
  - <calm>
  - <excited>
  - <whisper>
  - <slow>
  - <fast>
  - <voice:emma>
  - <voice:pluto_young>
  reserved_spare: 64
shards:
  name: m3-shards
  version: 1
  workers: 8
model:
  n_layer: 6
  d_model: 384
  n_head: 6
  context_length: 1024
  compile: true
train:
  seed: 1337
  tokens_per_step: 262144
  micro_batch_size: 32
  max_steps: 1144
  lr: 0.001
  warmup_steps: 114
  precision: auto
  device: auto
  log_every: 10
  eval_every: 1000
  eval_batches: 50
  eval_split: val
  ckpt_every: 500
  max_wall_time_s: 84600
  cost_per_hour: 0.0
run:
  name: m3-ab-base
