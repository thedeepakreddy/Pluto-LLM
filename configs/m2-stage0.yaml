# M2 Stage 0: m2-speech-aligned with a tiny speech budget, for speech-check and smoke tests.
# Creator identity is NOT committed: pass --set identity.hf_dataset=<private id> (see README).
data:
  name: tinystories
  version: 1
  source:
    type: hf
    path: roneneldan/TinyStories
    split: train
    license: CDLA-Sharing-1.0
    url: https://huggingface.co/datasets/roneneldan/TinyStories
    note: Synthetic children's stories generated by GPT-3.5 and GPT-4 (Eldan & Li, 2023).
  split: {train: 0.98, val: 0.01, test: 0.01}
tokenizer:
  name: tinystories-bpe
  version: 1
  vocab_size: 4096
  train_sample_bytes: 100000000
shards:
  name: tinystories-shards
  version: 1
model:
  n_layer: 8
  d_model: 384
  n_head: 6
  context_length: 640
speech:
  name: tinystories-speech
  version: 1
  voice: bf_emma           # Kokoro-82M voice (off-the-shelf TTS, Apache-2.0)
  max_seconds: 30.0
  hours: 0.3
  val_chunks: 20
  test_chunks: 20
  qa_fraction: 0.02
  qa_max_wer: 0.3
  tts: kokoro
  codec: mimi              # Kyutai Mimi codec (off-the-shelf), 12.5 Hz x 8 codebooks
  asr: whisper             # Whisper small.en: QA filter and WER scoring only
audio:
  layout: aligned
  acoustic_delay: 1
  # Stage 2 output: the notebook copies the warm-start run's best.pt here.
  init_from: checkpoints/m2-warmstart-best.pt
train:
  seed: 1337
  tokens_per_step: 40960
  micro_batch_size: 16
  max_steps: 50
  lr: 0.0006
  warmup_steps: 10        # must be <= max_steps (50)
  precision: auto
  device: auto
  log_every: 10
  eval_every: 25
  eval_batches: 20
  eval_split: val
  ckpt_every: 25
  max_wall_time_s: 41400   # 11.5 h: save and exit before Kaggle's 12 h limit
  cost_per_hour: 0.0       # free tier; set the real $/h on rented GPUs
run:
  name: m2-stage0
