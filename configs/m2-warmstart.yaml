# M2 Stage 2: text-only warm start of the M2 brain (8L/384d/6H, ctx 640) on TinyStories,
# reusing the M1 data, tokenizer and shards.
data:
  name: tinystories
  version: 1
  source:
    type: hf
    path: roneneldan/TinyStories
    split: train
    license: CDLA-Sharing-1.0
    url: https://huggingface.co/datasets/roneneldan/TinyStories
    note: Synthetic children's stories generated by GPT-3.5 and GPT-4 (Eldan & Li, 2023).
  split: {train: 0.98, val: 0.01, test: 0.01}
tokenizer:
  name: tinystories-bpe
  version: 1
  vocab_size: 4096
  train_sample_bytes: 100000000
shards:
  name: tinystories-shards
  version: 1
model:
  n_layer: 8
  d_model: 384
  n_head: 6
  context_length: 640
train:
  seed: 1337
  tokens_per_step: 81920
  micro_batch_size: 32
  max_steps: 2400
  lr: 0.001
  warmup_steps: 200
  precision: auto
  device: auto
  log_every: 10
  eval_every: 250
  eval_batches: 20
  eval_split: val
  ckpt_every: 250
  max_wall_time_s: 41400   # 11.5 h: save and exit before Kaggle's 12 h limit
  cost_per_hour: 0.0       # free tier; set the real $/h on rented GPUs
run:
  name: m2-warmstart
