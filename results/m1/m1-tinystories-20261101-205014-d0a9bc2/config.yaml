data:
  name: tinystories
  version: 1
  source:
    type: hf
    path: roneneldan/TinyStories
    split: train
    text_field: text
    max_docs: null
    license: CDLA-Sharing-1.0
    url: https://huggingface.co/datasets/roneneldan/TinyStories
    note: Synthetic children's stories generated by GPT-3.5 and GPT-4 (Eldan & Li,
      2023).
  min_chars: 20
  max_chars: 20000
  split:
    test: 0.01
    train: 0.98
    val: 0.01
  root: data
tokenizer:
  name: tinystories-bpe
  version: 1
  vocab_size: 4096
  train_sample_bytes: 100000000
  root: tokenizers
shards:
  name: tinystories-shards
  version: 1
  shard_size_tokens: 100000000
  root: shards
model:
  n_layer: 6
  d_model: 256
  n_head: 8
  context_length: 256
  dropout: 0.0
  attn_impl: sdpa
  compile: false
train:
  seed: 1337
  tokens_per_step: 65536
  micro_batch_size: 64
  max_steps: 3000
  lr: 0.001
  warmup_steps: 200
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
  precision: auto
  device: auto
  log_every: 10
  eval_every: 250
  eval_batches: 20
  eval_split: val
  ckpt_every: 250
  keep_last: 3
  max_wall_time_s: 41400.0
  cost_per_hour: 0.0
  wandb_project: null
  hub_repo: null
run:
  name: m1-tinystories
  root: runs
